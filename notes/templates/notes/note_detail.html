{% extends 'base.html' %}

{% block title %}{{ note.title }} - NotesApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'note_list' %}">Notes</a></li>
                <li class="breadcrumb-item active">{{ note.title }}</li>
            </ol>
        </nav>

        <div class="card note-card-{{ note.color }} p-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h1 class="fw-bold mb-0">{{ note.title }}</h1>
                {% if note.is_pinned %}
                <span class="badge bg-warning text-dark"><i class="fas fa-thumbtack me-1"></i>Pinned</span>
                {% endif %}
            </div>
            <hr>
            <div class="note-content mb-4" style="white-space: pre-wrap;">{{ note.content }}</div>
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">Last updated: {{ note.updated_at|date:"F d, Y H:i" }}</small>
                <div class="btn-group">
                    <a href="{% url 'note_update' note.pk %}" class="btn btn-outline-dark">
                        <i class="fas fa-edit me-1"></i>Edit
                    </a>
                    <a href="{% url 'note_delete' note.pk %}" class="btn btn-outline-danger">
                        <i class="fas fa-trash me-1"></i>Delete
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
