{% extends 'base.html' %}

{% block title %}Delete Note - NotesApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-5 text-center">
            <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
            <h2 class="fw-bold">Are you sure?</h2>
            <p class="text-muted">You are about to delete the note: <strong>"{{ object.title }}"</strong>. This action
                cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-danger btn-lg">Yes, Delete It</button>
                    <a href="{% url 'note_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
